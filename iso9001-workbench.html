<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="ISO9001内审员">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>ISO 9001 内审员工作台 · 入门 + 实务</title>
<style>
:root{
  --bg:#eef2f8; --card:#fff; --ink:#1f2937; --muted:#6b7280; --line:#e5e9f0;
  --primary:#2563eb; --primary-d:#1d4ed8; --primary-l:#e8f0fe;
  --ok:#16a34a; --ok-l:#e7f6ec; --bad:#dc2626; --bad-l:#fdecec; --warn:#d97706; --warn-l:#fdf3e3;
  --radius:14px; --shadow:0 2px 10px rgba(23,43,77,.07),0 8px 28px rgba(23,43,77,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;font-size:15px;padding-bottom:40px}
.topbar{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.93);backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-weight:800;font-size:16px;display:flex;align-items:center;gap:8px}
.brand .logo{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#1e40af,#0ea5a4);display:grid;place-items:center;color:#fff;font-size:13px;font-weight:800}
.nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
.nav button{border:1px solid transparent;background:transparent;color:var(--muted);font-size:13.5px;font-weight:600;padding:6px 11px;border-radius:999px;cursor:pointer;font-family:inherit}
.nav button:hover{background:#f1f5fb;color:var(--ink)}
.nav button.on{background:var(--primary-l);color:var(--primary-d)}
.wrap{max-width:1000px;margin:0 auto;padding:18px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
h1{font-size:21px;margin:2px 0 6px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:14.5px;margin:14px 0 6px}
.muted{color:var(--muted)} .small{font-size:13px}
.hero{background:linear-gradient(135deg,#1e40af,#2563eb 45%,#0ea5a4);color:#fff;border:none}
.hero h1{color:#fff} .hero p{color:rgba(255,255,255,.92);margin:6px 0 10px}
.pill{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:999px;padding:3px 10px;font-size:12px;margin:0 6px 6px 0}
.btn{border:1px solid var(--line);background:#fff;color:var(--ink);font-family:inherit;font-size:14px;font-weight:600;padding:9px 15px;border-radius:10px;cursor:pointer;transition:.15s}
.btn:hover{border-color:#cfd8e6;background:#fafbfe}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.primary:hover{background:var(--primary-d)}
.btn.sm{padding:6px 11px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;font-family:inherit}
.chip.on{background:var(--primary);border-color:var(--primary);color:#fff}
input[type=text],textarea,select{font-family:inherit;font-size:14.5px;padding:9px 11px;border:1.5px solid var(--line);border-radius:10px;width:100%;background:#fff}
input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary)}
textarea{resize:vertical;line-height:1.6}
label.f{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 4px;font-weight:600}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:700px){.g2,.g3{grid-template-columns:1fr}}
.cl{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fff}
.cl .no{display:inline-block;background:var(--primary-l);color:var(--primary-d);font-weight:800;border-radius:8px;padding:1px 9px;font-size:13px;margin-right:8px}
.cl .nm{font-weight:700}
.cl .key{margin:6px 0 4px;font-size:14px}
.cl ul{margin:4px 0 0;padding-left:20px}
.cl li{font-size:13.5px;color:#374151}
.pit{font-size:12.5px;color:#92400e;background:var(--warn-l);border-radius:8px;padding:4px 9px;display:inline-block;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{border:1px solid #cfd8e6;padding:6px 8px;text-align:left;vertical-align:top}
th{background:#f1f5fb;font-weight:700}
.tbl-wrap{overflow:auto}
.chk-group{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff}
.chk-group h4{margin:0 0 6px;font-size:13.5px}
.chk-group label{display:inline-flex;align-items:center;gap:5px;font-size:13px;margin:2px 12px 2px 0;cursor:pointer}
.foot{text-align:center;color:var(--muted);font-size:12.5px;padding:22px 16px 8px}
.note{background:var(--warn-l);border:1px solid #f3d9a4;color:#92400e;border-radius:10px;padding:10px 12px;font-size:13.5px}
.ok-note{background:var(--ok-l);border:1px solid #a7e0bb;color:#166534;border-radius:10px;padding:10px 12px;font-size:13.5px}
.step{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.step:last-child{border:none}
.step .n{flex:0 0 30px;height:30px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
#printarea{display:none}
#printarea .sheet{color:#111;font-size:12.5px;line-height:1.6}
#printarea h1{font-size:18px;margin:0 0 4px}
#printarea h2{font-size:14px;margin:12px 0 6px}
.sheet-sub{color:#555;font-size:11.5px;margin-bottom:10px;border-bottom:1px solid #d8d8d8;padding-bottom:7px}
#printarea table{font-size:11.5px}
#printarea .sign td{height:44px}
@media print{
  .topbar,.foot,.no-print{display:none!important}
  #app{display:none!important}
  #printarea{display:block!important}
  body{background:#fff;padding:0;font-size:12.5px}
  tr{break-inside:avoid;page-break-inside:avoid}
  @page{margin:14mm}
}

/* ===== 移动端适配（手机 / 平板 / 添加到主屏幕） ===== */
@media(max-width:760px){
  html{-webkit-text-size-adjust:100%}
  .topbar{padding-top:env(safe-area-inset-top)}
  .topbar-in{padding:8px 12px;gap:8px}
  .brand{font-size:15px;max-width:100%}
  .brand>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* 导航改成单行横向滑动，避免换行把顶栏撑高遮住内容 */
  .nav{width:100%;margin-left:0;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;
       -webkit-overflow-scrolling:touch;scrollbar-width:none;gap:4px;padding:1px 0 3px}
  .nav::-webkit-scrollbar{display:none}
  .nav button{flex:0 0 auto;white-space:nowrap;padding:8px 13px;font-size:13.5px;min-height:40px}
  .wrap{padding:12px calc(12px + env(safe-area-inset-left)) 72px calc(12px + env(safe-area-inset-right))}
  .card{padding:15px 13px;border-radius:12px}
  h1{font-size:20px}
  .hero{padding:22px 18px;border-radius:16px}
  .hero h1{font-size:21px}
  .btn{padding:11px 15px;min-height:44px}
  .btn.sm{padding:9px 12px;min-height:40px;font-size:13px}
  .chip{padding:8px 14px;min-height:38px}
  /* 表单控件 ≥16px 可避免 iOS 聚焦时自动放大 */
  input[type=text],[type=number],input[type=email],input[type=date],textarea,select{font-size:16px}
  /* 表格：外层横向滚动，不再撑破页面 */
  .tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:10px;border:1px solid var(--line)}
  .tbl-wrap>table{margin:0;border:0}
  table{font-size:13px}
  th,td{padding:6px 8px}
  .grid.c3,.grid.c4{grid-template-columns:repeat(2,1fr)}
  .g2,.g3{grid-template-columns:1fr}
  .score-ring{width:118px;height:118px}
  .foot{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
}
@media(max-width:520px){
  .grid.c2,.grid.c3,.grid.c4,.g2,.g3{grid-template-columns:1fr!important}
  .nav button{padding:8px 12px;font-size:13px}
  .wrap{padding-left:calc(10px + env(safe-area-inset-left));padding-right:calc(10px + env(safe-area-inset-right))}
}
@media print{.tbl-wrap{overflow:visible!important;border:0!important}}
</style>
</head>
<body>
<div class="topbar"><div class="topbar-in">
  <div class="brand"><span class="logo">W</span><span>ISO 9001 内审员工作台</span></div>
  <nav class="nav" id="nav">
    <button data-go="road" class="on">入门路线</button>
    <button data-go="clause">条款速查</button>
    <button data-go="checklist">内审检查表</button>
    <button data-go="ncr">不符合项报告</button>
    <button data-go="terms">术语/模板</button>
    <button data-go="sim">模拟内审</button>
    <button data-go="v2026">2026换版</button>
    <button data-go="diff">差异对照</button>
    <button data-go="report">内审报告</button>
    <button data-go="nclib">对策库</button>
    <button data-go="docs">审核文档</button>
    <button data-go="trace">审核思路</button>
  </nav>
</div></div>
<div class="wrap" id="app"></div>
<div class="foot">ISO 9001:2015 / GB-T 19001-2016 · 内审员入门与实务工具 · 数据保存在本机浏览器</div>

<script>
"use strict";
/* ============ 条款数据（要点 + 检查问题 + 常见不符合） ============ */
var CLAUSES=[
{c:'4.1',n:'理解组织及其环境',key:'确定与宗旨、战略方向相关、并影响体系预期结果能力的各种外部和内部因素。',
 it:['公司识别了哪些外部因素（法规、技术、竞争、市场、社会文化）？','识别了哪些内部因素（价值观、文化、知识、绩效、结构）？','这些因素如何监视和评审？多久更新一次？'],
 pit:'常见问题：完全没做环境分析，或做了不更新。'},
{c:'4.2',n:'理解相关方的需求和期望',key:'确定与体系有关的相关方及其有关要求，并监视评审。',
 it:['识别了哪些相关方（顾客、供方、员工、监管、股东）？','每个相关方的有关要求是什么？','如何监视和评审相关方信息？'],
 pit:'常见问题：只列了顾客，漏掉监管/员工/供方。'},
{c:'4.3',n:'确定质量管理体系的范围',key:'确定体系的边界和适用性，范围作为成文信息可获得和保持。',
 it:['体系范围是什么？是否形成文件？','有无不适用条款（如8.3设计）？理由是否充分、是否说明？'],
 pit:'常见问题：删减设计开发却无理由。'},
{c:'4.4',n:'质量管理体系及其过程',key:'识别所需过程及其相互作用，确定输入输出、准则、资源、职责、风险和机遇，并改进。',
 it:['识别了哪些过程？过程顺序和相互作用（龟形图/过程图）？','每个过程的输入、输出、准则、资源、职责是否明确？','过程绩效如何监视？不达标怎么办？'],
 pit:'常见问题：只有文件清单，没有过程之间的关系。'},
{c:'5.1',n:'领导作用和承诺',key:'最高管理者对体系有效性负责，确保方针目标、资源、沟通、以顾客为关注焦点。',
 it:['最高管理者如何证实其领导作用（会议记录、资源投入、参与评审）？','是否传达满足顾客和法规要求的重要性？','是否确保体系融入业务过程？'],
 pit:'常见问题：老板只在评审签字，不参与。'},
{c:'5.2',n:'方针',key:'制定质量方针：适应宗旨、提供目标框架、含满足要求与持续改进承诺；沟通并理解。',
 it:['方针内容是否满足四项要求？','方针是否形成文件、在组织内沟通并被理解？','员工能说出方针吗？'],
 pit:'常见问题：方针贴在墙上但员工答不出。'},
{c:'5.3',n:'组织的岗位、职责和权限',key:'确保相关岗位的职责权限得到分配、沟通和理解。',
 it:['岗位职责文件是否覆盖体系各过程？','职责权限是否沟通到人？','有无职责不清、相互推诿？'],
 pit:'常见问题：职责边界模糊，尤其跨部门接口。'},
{c:'6.1',n:'应对风险和机遇的措施',key:'策划体系时考虑4.1、4.2，确定需应对的风险和机遇，并策划措施、评价有效性。',
 it:['识别了哪些风险和机遇？依据什么？','针对风险机遇策划了什么措施？','措施是否有效？如何评价？'],
 pit:'常见问题：只做了一份风险清单，没有措施和评价。'},
{c:'6.2',n:'质量目标及其实现的策划',key:'目标与方针一致、可测量、与合格及顾客满意相关；策划实现（做什么/资源/谁/何时/如何评价）。',
 it:['各部门质量目标是什么？是否可测量？','目标是否分解到相关职能层级？','如何统计、考核、评价结果？'],
 pit:'常见问题：目标不可量化，或员工不知道本部门目标。'},
{c:'6.3',n:'变更的策划',key:'对体系变更进行策划：目的与后果、体系完整性、资源、职责权限。',
 it:['体系发生变更（机构调整、搬迁、上新线）时是否策划？','变更对过程接口、资源、职责的影响是否评估？'],
 pit:'常见问题：机构调整后文件没跟着改。'},
{c:'7.1.1',n:'资源—总则',key:'确定并提供建立、实施、保持和持续改进体系所需的资源。',
 it:['资源需求如何确定？是否提供（人、物、财、信息）？','资源不足时如何提出和解决？'],
 pit:'常见问题：资源申请无流程，靠口头。'},
{c:'7.1.2',n:'人员',key:'确定并提供实施体系、运行和控制过程所需的人员。',
 it:['关键岗位人员是否配齐？','人员数量/能力能否满足过程需要？'],
 pit:'常见问题：一人多岗，实际无法履职。'},
{c:'7.1.3',n:'基础设施',key:'确定、提供并维护所需基础设施：建筑物/场所、设备（含软硬件）、运输资源、信息和通信技术。',
 it:['设备台账、点检保养、维修记录是否齐全？','关键设备是否影响产品质量？如何控制？','IT系统（如ERP/MES）是否受控？'],
 pit:'常见问题：设备无保养计划，坏了才修。'},
{c:'7.1.4',n:'过程运行环境',key:'确定、提供并维护所需的过程运行环境（社会、心理、物理因素的组合）。',
 it:['现场温湿度、照度、洁净度、噪声、防静电是否受控？','有无影响质量和人员安全的因素？','员工心理/疲劳因素是否有考虑？'],
 pit:'常见问题：电子/精密工序环境无监控记录。'},
{c:'7.1.5',n:'监视和测量资源',key:'总则：确定提供适合用途并维护的资源，保留证据；测量溯源：校准/检定、标识、防护、超差处理。',
 it:['测量设备清单、校准/检定计划是否齐全？','是否在有效期内？标识是否清楚？','设备超期/失准时如何追溯以往测量结果？'],
 pit:'高频不符合：卡尺等超期未校准仍在使用。'},
{c:'7.1.6',n:'组织的知识',key:'确定运行过程、实现产品符合性所需的组织专有知识，并保持、更新。',
 it:['沉淀了哪些经验、图纸、专利、工艺诀窍？','人员流失时知识如何保留？','是否获取外部知识（标准、顾客、供方）？'],
 pit:'常见问题：知识全在老师傅脑子里。'},
{c:'7.2',n:'能力',key:'确定能力要求→确保人员胜任→采取措施获得能力→保留成文信息。',
 it:['各岗位能力要求（任职资格）是否明确？','培训计划、培训记录、效果评价是否齐全？','特殊工种/关键岗位是否持证？'],
 pit:'高频不符合：新员工/特殊工种无培训或资格记录。'},
{c:'7.3',n:'意识',key:'人员知晓方针、相关目标、其对体系有效性的贡献、不符合要求的后果。',
 it:['员工知道自己岗位对质量的影响吗？','知道不符合要求的后果吗？'],
 pit:'常见问题：一线员工对体系"无感"。'},
{c:'7.4',n:'沟通',key:'确定与体系相关的内外部沟通：内容、时机、对象、方式、主体。',
 it:['内部沟通（例会、看板、邮件）是否有安排？','与顾客/供方/监管的沟通渠道是否明确？'],
 pit:'常见问题：沟通靠随机，无策划。'},
{c:'7.5',n:'成文信息',key:'创建更新（标识说明、格式载体、评审批准）；控制（获取、保护、分发、存储、变更、保留处置）。',
 it:['文件是否经评审批准？现行版本是否唯一有效？','现场使用的是否有效版本？作废文件如何处置？','记录填写是否及时、完整、可追溯、妥善保存？'],
 pit:'高频不符合：现场使用过期版作业文件/记录涂改。'},
{c:'8.1',n:'运行策划和控制',key:'策划实施控制所需过程，确定产品要求；建立过程准则；确定资源；实施控制；外包控制。',
 it:['生产/服务过程是否策划（工艺、流程、控制计划）？','过程准则（工艺参数、检验标准）是否明确？','外包过程如何控制？'],
 pit:'常见问题：外包/委外过程无控制。'},
{c:'8.2.1',n:'顾客沟通',key:'提供产品信息、处理问询/合同/订单（含更改）、获取顾客反馈（含投诉）、处置顾客财产、应急要求。',
 it:['合同/订单评审与沟通记录是否完整？','顾客投诉如何接收、处理、反馈？'],
 pit:'常见问题：投诉无闭环。'},
{c:'8.2.2',n:'产品和服务要求的确定',key:'确定明示要求、虽未明示但预期或必要的要求、法规要求、组织认为必要的要求。',
 it:['订单/技术协议中要求是否完整识别？','隐含要求（如包装、交付）是否考虑？','适用法规要求是否识别？'],

var fSearch='';
function viewClause(){
  var h='<div class="card"><h2>条款速查</h2>'+
    '<p class="small muted">标准 4~10 章共 '+CLAUSES.length+' 条。每条附“条款要义、目的、内审要问什么、常见客观证据、常见不符合、关联条款”。<b>点任意一条跳转到详情页。</b></p>'+

function renderClauseList(){
  var box=document.getElementById('clauseList'); if(!box) return;

    if(!kw) return true;
    var d=DETAIL[x.c]||{};

    return blob.indexOf(kw)>=0;

    var d=DETAIL[x.c]||{};

       '<div class="row"><span><span class="no">'+x.c+'</span><span class="nm">'+esc(x.n)+'</span></span><span class="spacer"></span><span class="small" style="color:var(--primary-d);font-weight:600">查看详情 →</span></div>'+

       (x.pit?'<div class="pit">'+esc(x.pit)+'</div>':'')+'</div>';
  });
  box.innerHTML=h;
}

function exportNCR(){
  readNCR();
  if(!NCR.fact && !NCR.clause){ alert('至少填写"事实描述"和"条款"。'); return; }
  var t=ncrText(NCR); var d=new Date(); function p(n){return (n<10?'0':'')+n;}
  var name='不符合项报告-'+(NCR.dept||'NCR')+'-'+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate());

var fTerms='';
function renderTerms(){
  var box=document.getElementById('termList'); if(!box) return;

var curClause='4.1';
function openClause(c){
  var t=CLAUSES.filter(function(x){return x.c===c;})[0];
  if(!t){ t=CLAUSES.filter(function(x){return (''+c).indexOf(x.c)===0;})[0]; }

var fNC='';
function viewNCLib(){
  var h='<div class="card"><h2>不符合项对策库</h2>'+
    '<p class="small muted">共 '+NCLIB.length+' 条高频不符合，每条给出：典型描述、常见原因、纠正措施范例、举一反三。配合「不符合项报告」页一起用。</p>'+
    '<input type="text" id="nq" placeholder="搜索条款号或关键词，如 8.4 / 供方 / 校准 / 投诉" value="'+esc(fNC)+'" oninput="fNC=this.value;renderNCLib()">'+
    '<div class="row" style="margin-top:8px"><button class="btn sm" onclick="exportNCLib()">⬇ 导出全部 Markdown</button></div>'+
    '<div id="ncList" style="margin-top:10px"></div></div>';
  return h;
}
function renderNCLib(){
  var box=document.getElementById('ncList'); if(!box) return;
  var kw=fNC.trim().toLowerCase();
  var list=NCLIB.filter(function(x){ if(!kw) return true; return (x.c+' '+x.t+' '+x.nc+' '+x.why+' '+x.act+' '+x.prev).toLowerCase().indexOf(kw)>=0; });
  var h='';
  if(!list.length) h='<div class="muted">没有匹配的对策。</div>';
  list.forEach(function(x){
    h+='<div class="cl"><div class="row"><span><span class="no" style="cursor:pointer" onclick="openClause(\''+x.c+'\')">'+x.c+'</span><span class="nm">'+esc(x.t)+'</span></span></div>'+
       '<div class="small" style="margin-top:6px"><b>典型不符合：</b>'+esc(x.nc)+'</div>'+
       '<div class="small" style="margin-top:4px"><b>常见原因：</b>'+esc(x.why)+'</div>'+
       '<div class="small" style="margin-top:4px;color:#15803d"><b>纠正措施范例：</b>'+esc(x.act)+'</div>'+
       '<div class="small" style="margin-top:4px;color:#92400e"><b>举一反三：</b>'+esc(x.prev)+'</div></div>';
  });
  box.innerHTML=h;
}
function exportNCLib(){
  var t='# ISO 9001 内审员 · 不符合项对策库\n\n> 共 '+NCLIB.length+' 条 · '+today()+' · 依据 ISO 9001:2015\n\n';
  NCLIB.forEach(function(x,i){ t+='## '+(i+1)+'. ['+x.c+'] '+x.t+'\n\n- **典型不符合：** '+x.nc+'\n- **常见原因：** '+x.why+'\n- **纠正措施范例：** '+x.act+'\n- **举一反三：** '+x.prev+'\n\n---\n\n'; });
  try{ var blob=new Blob([t],{type:'text/markdown;charset=utf-8'}); var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='ISO9001-不符合项对策库-'+today()+'.md'; document.body.appendChild(a); a.click(); setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},2000); }catch(e){ alert('导出失败：'+e.message); }
}

function viewTrace(){

      ['① 抓线索','② 追问（5W1H）','③ 取证（看/查/追）','④ 对照准则','⑤ 判定（符合/不符合）'].map(function(s,i){ return '<div style="flex:0 0 auto;background:'+(i===4?'var(--primary-l)':'#f1f5fb')+';border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:700;font-size:13.5px;white-space:nowrap">'+s+'</div>'+(i<4?'<div style="display:grid;place-items:center;color:var(--muted)">→</div>':''); }).join('')+
    '</div>'+
    '<div class="grid g2" style="margin-top:10px">'+
      '<div class="ok-note"><b>顺藤摸瓜</b><br><span class="small">顺着一条线素一路追：订单→设计→采购→生产→检验→入库→交付，最容易发现体系断点。</span></div>'+
      '<div class="ok-note"><b>三种问法</b><br><span class="small">开放式（怎么做）、封闭式（是否…）、澄清式（追问细节）。让对方自己说，比你猜准。</span></div>'+
      '<div class="ok-note"><b>抽样要有代表性</b><br><span class="small">记录写清"审了哪几份、哪些批次"，给结论留余地（只对样本负责）。</span></div>'+
      '<div class="ok-note"><b>对事不对人</b><br><span class="small">结论基于客观证据，不当场定罪、不替对方写整改方案。</span></div>'+
    '</div></div>'+
    '<div class="card"><div class="row"><h2 style="margin:0">按条款的追查链</h2><span class="spacer"></span>'+

      '<div id="traceList" style="margin-top:12px"></div></div>';

}
function renderTrace(){
  var box=document.getElementById('traceList'); if(!box) return;
  var kw=fTrace.trim().toLowerCase();
  var list=TRACE.filter(function(x){ if(!kw) return true; return (x.c+' '+x.lead+' '+x.chain.join(' ')+' '+x.ev+' '+x.find).toLowerCase().indexOf(kw)>=0; });
  var h='';
  if(!list.length) h='<div class="muted">没有匹配的追查链。</div>';
  list.forEach(function(x){
    h+='<div class="cl">'+
      '<div class="row"><span class="no" style="cursor:pointer" onclick="openClause(\''+x.c+'\')">'+x.c+'</span><span class="nm">🔎 线索：'+esc(x.lead)+'</span></div>'+
      '<ol style="margin:8px 0 0;padding-left:22px">'+x.chain.map(function(s){return '<li class="small">'+esc(s)+'</li>';}).join('')+'</ol>'+
      '<div class="small" style="margin-top:6px"><b>该查的证据：</b>'+esc(x.ev)+'</div>'+
      '<div class="pit" style="display:block;margin-top:6px"><b>可能结论：</b>'+esc(x.find)+'</div></div>';
  });
  box.innerHTML=h;
}

/* ===== 表格自适应：外包一层可横向滚动的容器（移动端不撑破页面） ===== */
function wrapTables(root){
  var scope=root||document;
  var ts=scope.querySelectorAll('table');
  for(var i=0;i<ts.length;i++){
    var t=ts[i];
    if(t.parentNode && t.parentNode.classList && t.parentNode.classList.contains('tbl-wrap')) continue;
    if(t.closest && t.closest('#printarea')) continue;
    var w=document.createElement('div'); w.className='tbl-wrap';
    t.parentNode.insertBefore(w,t); w.appendChild(t);
  }
}
/* 动态插入的表格（如生成检查表预览）也能自动包层 */
(function(){
  var app=document.getElementById('app');
  if(!app || !window.MutationObserver) return;
  var busy=false;
  new MutationObserver(function(){
    if(busy) return;
    busy=true;
    try{ wrapTables(app); } finally { setTimeout(function(){ busy=false; },0); }
  }).observe(app,{childList:true,subtree:true});
})();
/* ============ 渲染 ============ */
function render(){
  var app=document.getElementById('app'); var h='';
  if(view==='road') h=viewRoad();
  else if(view==='clause') h=viewClause();
  else if(view==='clauseDetail') h=viewClauseDetail();
  else if(view==='checklist') h=viewChecklist();
  else if(view==='ncr') h=viewNCR();
  else if(view==='terms') h=viewTerms();
  else if(view==='sim') h=viewSim();
  else if(view==='v2026') h=viewV2026();
  else if(view==='diff') h=viewDiff();
  else if(view==='report') h=viewReport();
  else if(view==='nclib') h=viewNCLib();
  else if(view==='docs') h=viewDocs();
  else if(view==='trace') h=viewTrace();
  app.innerHTML=h;
  wrapTables(app);
  if(view==='clause') renderClauseList();
  if(view==='terms') renderTerms();
  if(view==='nclib') renderNCLib();
  if(view==='trace') renderTrace();
  window.scrollTo(0,0);
}
